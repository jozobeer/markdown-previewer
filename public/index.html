<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdownプレビューア</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231a1b26' rx='4'/%3E%3Crect x='6' y='5' width='14' height='18' rx='1' fill='none' stroke='%237aa2f7' stroke-width='1.5'/%3E%3Cline x1='9' y1='10' x2='15' y2='10' stroke='%237aa2f7' stroke-width='1.2'/%3E%3Cline x1='9' y1='14' x2='15' y2='14' stroke='%237aa2f7' stroke-width='1.2'/%3E%3Cline x1='9' y1='18' x2='13' y2='18' stroke='%237aa2f7' stroke-width='1.2'/%3E%3Cpath d='M22 18 L22 26 M18 22 L22 26 L26 22' stroke='%23bb9af7' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #1a1b26;
      color: #c0caf5;
    }

    header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #292e42;
      background: #16161e;
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      color: #7aa2f7;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      min-height: 0;
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: auto;
    }

    .pane-label {
      padding: 0.4rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #565f89;
      background: #16161e;
      border-bottom: 1px solid #292e42;
    }

    .editor-pane {
      border-right: 1px solid #292e42;
    }

    #editor {
      flex: 1;
      width: 100%;
      min-height: 200px;
      padding: 1rem;
      border: none;
      outline: none;
      resize: none;
      font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", Consolas, monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      color: #c0caf5;
      background: #0f0f14;
    }

    #preview {
      flex: 1;
      padding: 1rem 1.25rem;
      line-height: 1.7;
      overflow: auto;
    }

    #preview h1, #preview h2, #preview h3,
    #preview h4, #preview h5, #preview h6 {
      margin: 1.25em 0 0.5em;
      line-height: 1.3;
      color: #7aa2f7;
    }

    #preview h1 { font-size: 1.75rem; border-bottom: 1px solid #292e42; padding-bottom: 0.3em; }
    #preview h2 { font-size: 1.4rem; }
    #preview h3 { font-size: 1.15rem; }

    #preview p { margin: 0.75em 0; }
    #preview ul, #preview ol { margin: 0.75em 0; padding-left: 1.5em; }
    #preview li { margin: 0.25em 0; }

    #preview a {
      color: #7dcfff;
      text-decoration: underline;
    }

    #preview a:hover { color: #bb9af7; }

    #preview strong { color: #ff9e64; font-weight: 600; }
    #preview em { color: #bb9af7; font-style: italic; }

    #preview code {
      font-family: "Cascadia Code", "Fira Code", Consolas, monospace;
      font-size: 0.85em;
      padding: 0.15em 0.4em;
      border-radius: 3px;
      background: #24283b;
      color: #9ece6a;
    }

    #preview pre {
      margin: 0.75em 0;
      padding: 1rem;
      border-radius: 6px;
      background: #24283b;
      overflow-x: auto;
    }

    #preview pre code {
      padding: 0;
      background: none;
      color: #c0caf5;
    }

    #preview blockquote {
      margin: 0.75em 0;
      padding: 0.5em 1em;
      border-left: 3px solid #7aa2f7;
      color: #a9b1d6;
      background: #16161e;
    }

    #preview hr {
      border: none;
      border-top: 1px solid #292e42;
      margin: 1.5em 0;
    }

  footer {
      margin-top: 3rem;
      text-align: center;
      font-size: 0.8rem;
      opacity: 0.6;
      padding-bottom: 1rem;
    }

    footer a {
      color: inherit;
    }

    @media (max-width: 720px) {
      main {
        grid-template-columns: 1fr;
      }

      .editor-pane {
        border-right: none;
        border-bottom: 1px solid #292e42;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Markdownプレビューア</h1>
  </header>
  <main>
    <div class="pane editor-pane">
      <div class="pane-label">Markdown</div>
      <textarea id="editor" spellcheck="false" aria-label="Markdown入力"></textarea>
    </div>
    <div class="pane">
      <div class="pane-label">プレビュー</div>
      <div id="preview"></div>
    </div>
  </main>
  <footer style="margin-top:3rem;text-align:center;font-size:.8rem;opacity:.6">
    <a href="https://apps.jozo.beer" style="color:inherit">apps.jozo.beer</a>
  </footer>
  <script>
    const STORAGE_KEY = 'markdown-previewer:draft';

    const SAMPLE = `# Markdown プレビューア

左に **Markdown** を書くと右にプレビューが表示されます。

## 記法の例

- 箇条書き
- もう一つ

1. 番号付き
2. 二番目

[リンク](https://example.com)

` + '`inline code`' + `

```js
console.log('code block');
```
`;

    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');

    function escapeHtml(s) {
      return s
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function isSafeUrl(url) {
      const t = url.trim().toLowerCase();
      return t.startsWith('http:') || t.startsWith('https:') ||
             t.startsWith('#') || t.startsWith('/') || t.startsWith('mailto:');
    }

    function parseInline(s) {
      const codes = [];
      s = s.replace(/`([^`]+)`/g, function (_, code) {
        codes.push(code);
        return '\x00C' + (codes.length - 1) + '\x00';
      });
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function (_, text, url) {
        if (isSafeUrl(url)) {
          return '<a href="' + url + '">' + text + '</a>';
        }
        return '[' + text + '](' + url + ')';
      });
      s = s.replace(/\x00C(\d+)\x00/g, function (_, i) {
        return '<code>' + codes[i] + '</code>';
      });
      return s;
    }

    function closeLists(state) {
      if (state.inUl) { state.out.push('</ul>'); state.inUl = false; }
      if (state.inOl) { state.out.push('</ol>'); state.inOl = false; }
    }

    function parseBlocks(src) {
      const lines = src.split('\n');
      const state = { out: [], inUl: false, inOl: false };
      let i = 0;

      while (i < lines.length) {
        const line = lines[i];

        const fence = line.match(/^```(\w*)/);
        if (fence) {
          closeLists(state);
          const codeLines = [];
          i++;
          while (i < lines.length && !lines[i].match(/^```/)) {
            codeLines.push(lines[i]);
            i++;
          }
          if (i < lines.length) i++;
          state.out.push('<pre><code>' + codeLines.join('\n') + '</code></pre>');
          continue;
        }

        const heading = line.match(/^(#{1,6}) (.+)$/);
        if (heading) {
          closeLists(state);
          const lvl = heading[1].length;
          state.out.push('<h' + lvl + '>' + parseInline(heading[2]) + '</h' + lvl + '>');
          i++;
          continue;
        }

        if (/^(-{3,}|\*{3,})$/.test(line)) {
          closeLists(state);
          state.out.push('<hr>');
          i++;
          continue;
        }

        const bq = line.match(/^> (.+)$/);
        if (bq) {
          closeLists(state);
          state.out.push('<blockquote><p>' + parseInline(bq[1]) + '</p></blockquote>');
          i++;
          continue;
        }

        const ul = line.match(/^[-*] (.+)$/);
        if (ul) {
          if (state.inOl) { state.out.push('</ol>'); state.inOl = false; }
          if (!state.inUl) { state.out.push('<ul>'); state.inUl = true; }
          state.out.push('<li>' + parseInline(ul[1]) + '</li>');
          i++;
          continue;
        }

        const ol = line.match(/^\d+\. (.+)$/);
        if (ol) {
          if (state.inUl) { state.out.push('</ul>'); state.inUl = false; }
          if (!state.inOl) { state.out.push('<ol>'); state.inOl = true; }
          state.out.push('<li>' + parseInline(ol[1]) + '</li>');
          i++;
          continue;
        }

        if (line.trim() === '') {
          closeLists(state);
          i++;
          continue;
        }

        closeLists(state);
        state.out.push('<p>' + parseInline(line) + '</p>');
        i++;
      }

      closeLists(state);
      return state.out.join('\n');
    }

    function renderMarkdown(src) {
      return parseBlocks(escapeHtml(src));
    }

    function render() {
      preview.innerHTML = renderMarkdown(editor.value);
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, editor.value);
      } catch (_) { /* ignore */ }
    }

    function load() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        editor.value = saved !== null ? saved : SAMPLE;
      } catch (_) {
        editor.value = SAMPLE;
      }
    }

    function debounce(fn, ms) {
      let timer;
      return function () {
        clearTimeout(timer);
        timer = setTimeout(fn, ms);
      };
    }

    const debouncedSave = debounce(save, 300);

    editor.addEventListener('input', function () {
      render();
      debouncedSave();
    });

    load();
    render();
  </script>
</body>
</html>
